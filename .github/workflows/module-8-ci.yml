name: Module 8 Phone Agent CI

on:
  push:
    branches:
      - feature/module-8-phone-agent
  pull_request:
    branches:
      - refactor/phase-2-architecture
  workflow_dispatch:
    inputs:
      jvm_test_filter:
        description: "Optional Gradle JVM test class or class#method filter"
        required: false
        type: string
        default: ""
      skip_jvm_tests:
        description: "Skip the full JVM suite when running one Android instrumentation test"
        required: false
        type: boolean
        default: false
      instrumentation_filter:
        description: "Optional AndroidJUnitRunner class#method filter; leave empty for the full suite"
        required: false
        type: string
        default: ""
      skip_instrumentation:
        description: "Skip emulator tests when running one JVM test"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: module-8-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile production Kotlin
        run: gradle --no-daemon --stacktrace compileDebugKotlin
      - name: Run JVM unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_jvm_tests != true }}
        env:
          JVM_TEST_FILTER: ${{ inputs.jvm_test_filter }}
        run: |
          if [ -n "$JVM_TEST_FILTER" ]; then
            gradle --no-daemon --stacktrace testDebugUnitTest --tests "$JVM_TEST_FILTER"
          else
            gradle --no-daemon --stacktrace testDebugUnitTest
          fi
      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lintDebug
      - name: Compile and package Android instrumentation tests
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Upload verified Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: module-8-android-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

  instrumentation:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_instrumentation != true }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
      SKIP_ANDROID_APK_BUILD: "true"
      ANDROID_TEST_FILTER: ${{ inputs.instrumentation_filter }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Android APKs
        uses: actions/download-artifact@v4
        with:
          name: module-8-android-test-apks
          path: app/build/outputs/apk
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -memory 4096 -cores 4
          disable-animations: true
          emulator-boot-timeout: 600000
          script: bash .github/scripts/run-android-instrumentation.sh
      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-8-instrumentation-diagnostics
          path: app/build/reports/androidTests/connected/diagnostics/
          if-no-files-found: warn
          retention-days: 3
