name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "feature/voice-system" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # PR verification compiles Kotlin, runs JVM tests and Android lint.
    # It deliberately does not assemble/install an APK before the integrated acceptance stage.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile production Kotlin
        run: gradle --no-daemon --stacktrace compileDebugKotlin

      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        if: always() && steps.setup_gradle.outcome == 'success'
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Compile Android instrumentation test sources
        if: always() && steps.setup_gradle.outcome == 'success'
        run: gradle --no-daemon --stacktrace compileDebugAndroidTestKotlin

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nestro-verification-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

  instrumented:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android instrumentation tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600000
          script: |
            set +e
            adb wait-for-device
            mkdir -p app/build/reports/androidTests/connected/diagnostics
            adb logcat -c
            adb shell pm list instrumentation > app/build/reports/androidTests/connected/diagnostics/instrumentation-list.txt 2>&1
            gradle --no-daemon --stacktrace connectedDebugAndroidTest
            test_exit_code=$?
            adb logcat -d -v threadtime > app/build/reports/androidTests/connected/diagnostics/emulator-logcat.txt 2>&1
            adb shell dumpsys activity exit-info app.nestro > app/build/reports/androidTests/connected/diagnostics/app-exit-info.txt 2>&1
            adb shell dumpsys activity exit-info app.nestro.test > app/build/reports/androidTests/connected/diagnostics/test-exit-info.txt 2>&1
            adb shell dumpsys package app.nestro.test > app/build/reports/androidTests/connected/diagnostics/test-package.txt 2>&1
            exit "$test_exit_code"

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nestro-android-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 7
