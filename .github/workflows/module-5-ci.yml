name: Module 5 Project Space CI

on:
  pull_request:
    branches:
      - refactor/phase-2-architecture
  push:
    branches:
      - feature/module-5-project-space
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-5-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile production Kotlin
        run: gradle --no-daemon --stacktrace compileDebugKotlin
      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Print JVM unit test failure details
        if: failure()
        run: |
          shopt -s nullglob
          reports=(app/build/test-results/testDebugUnitTest/*.xml)
          if (( ${#reports[@]} == 0 )); then
            echo "No JVM test XML reports were generated."
            exit 0
          fi
          for report in "${reports[@]}"; do
            echo "===== $report ====="
            cat "$report"
          done
      - name: Upload JVM unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-5-jvm-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 3
      - name: Run Android lint
        if: always()
        run: gradle --no-daemon --stacktrace lintDebug
      - name: Compile Android instrumentation test sources
        if: always()
        run: gradle --no-daemon --stacktrace compileDebugAndroidTestKotlin
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none -memory 4096 -cores 4
          disable-animations: true
          emulator-boot-timeout: 600000
          script: bash .github/scripts/run-android-instrumentation.sh
