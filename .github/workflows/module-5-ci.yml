name: Module 5 Project Space CI

on:
  push:
    branches: [ "feature/module-5-project-space" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-5-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile production Kotlin
        run: gradle --no-daemon --stacktrace compileDebugKotlin
      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Run Android lint
        if: always()
        run: gradle --no-daemon --stacktrace lintDebug
      - name: Compile Android instrumentation test sources
        if: always()
        run: gradle --no-daemon --stacktrace compileDebugAndroidTestKotlin
